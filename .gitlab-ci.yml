stages:
  - build

frontend-build:
  stage: build
  image: node:20
  script:
    - cd 2-FRONTEND
    - npm install
    - npm run build
  artifacts:
    paths:
      - 2-FRONTEND/dist
    expire_in: 1 week

backend-check:
  stage: build
  image: python:3.11
  script:
    - cd 1-BACKEND
    # Byte-compile: catches syntax errors
    - python -m compileall .
    # flake8 error classes only: undefined names, broken f-strings, syntax errors.
    # Static analysis - no need to install torch/transformers in CI.
    - pip install --quiet flake8
    - flake8 --select=E9,F63,F7,F82 --show-source .
