# Free deployment path — Render free web service (no card required).
# The backend no longer loads torch/transformers locally, so it fits Render's
# free 512 MB tier. See README.md, Step 1.
# In Render: New + → Blueprint → connect this repo → Apply.
services:
  - type: web
    name: voiceshield-api
    runtime: docker
    rootDir: 1-BACKEND
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false  # paste your (rotated) Neon connection string in the Render dashboard
      - key: HF_API_TOKEN
        sync: false  # free token from huggingface.co/settings/tokens
      - key: FRONTEND_ORIGIN
        sync: false  # paste your Vercel URL, e.g. https://voiceshield.vercel.app
